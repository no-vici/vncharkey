[workspace]
members = [
    "crates/vncharkey-core",
    "crates/fcitx5-vncharkey-ffi",
    "crates/vncharkey-settings",
    "crates/vncharkey-dev",
]
exclude = [
    "windows",
]
resolver = "2"

[workspace.package]
version = "0.3.9"
authors = ["VnCharKey Contributors <freedom@vncharkey.org>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/no-vici/vncharkey"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
